<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi stock BoosterStop</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1b1b1f; --muted: #6b6b75; --line: #e3e3df;
  --accent: #3b5bdb; --ok: #2f9e44; --low: #e8890c; --empty: #d6336c; --sold: #d6336c; --load: #2f9e44;
  --chip: #eef0f7; --shadow: 0 1px 2px rgba(0,0,0,.06);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121215; --panel: #1b1b20; --ink: #ececf1; --muted: #9a9aa6; --line: #2c2c34;
    --accent: #7b93ff; --ok: #51cf66; --low: #ffa94d; --empty: #f06595; --sold: #f06595; --load: #51cf66;
    --chip: #262a3a; --shadow: none;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  --bg: #121215; --panel: #1b1b20; --ink: #ececf1; --muted: #9a9aa6; --line: #2c2c34;
  --accent: #7b93ff; --ok: #51cf66; --low: #ffa94d; --empty: #f06595; --sold: #f06595; --load: #51cf66; --chip: #262a3a; --shadow: none;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header, main { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 14px 0; box-shadow: var(--shadow); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; }
.tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; flex: 1 1 240px; }
select, input, button.btn { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
button.btn { cursor: pointer; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.chart { width: 100%; height: 190px; display: block; cursor: crosshair; }
.chart text { fill: var(--muted); font-size: 11px; }
.floor { margin-bottom: 12px; }
.floor-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.slot { border: 1px solid var(--line); border-radius: 8px; padding: 7px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.slot.changed { border-color: var(--accent); }
.slot .top { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.slot img { width: 100%; height: 56px; object-fit: contain; }
.slot .ph { height: 56px; display: grid; place-items: center; font-size: 24px; }
.slot .name { font-size: 12px; line-height: 1.25; height: 2.5em; overflow: hidden; }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; }
.st-ok { background: var(--ok); } .st-low { background: var(--low); } .st-empty { background: var(--empty); }
.foot { display: flex; justify-content: space-between; gap: 4px; font-size: 12px; font-variant-numeric: tabular-nums; }
.d-sold { color: var(--sold); } .d-load { color: var(--load); }
.swap { font-size: 11px; color: var(--accent); }
a { color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; }
.scroll { overflow-x: auto; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.empty-msg { padding: 30px; text-align: center; color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
details.cfg summary { cursor: pointer; font-weight: 600; }
details.cfg td input { width: 64px; }
details.cfg td select { max-width: 320px; }
.tag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; background: var(--chip); color: var(--muted); }
.viz { position: relative; }
.viz svg { width: 100%; display: block; }
.viz svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.viz .hit { fill: transparent; cursor: default; }
.viz .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; min-width: 160px; z-index: 2; }
.viz .tip b { font-variant-numeric: tabular-nums; }
.viz .tip .r { display: flex; justify-content: space-between; gap: 12px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; border: 0; background: var(--panel); color: var(--ink); padding: 5px 10px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
.chart-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <h1>Suivi stock BoosterStop</h1>
  <div class="muted small" id="status">Chargement…</div>
</header>
<main>
  <nav class="tabs" id="tabs"></nav>
  <div id="app"><div class="empty-msg">Chargement de l'historique…</div></div>
</main>

<script>
const MACHINES = [
  { slug: 'rive', name: 'La Poste de Rive' },
  { slug: 'charmilles', name: 'La Poste des Charmilles' },
  { slug: 'petit-lancy', name: 'La Poste du Petit-Lancy' },
  { slug: 'plainpalais', name: 'La Poste de Plainpalais' },
  { slug: 'thonex', name: 'La Poste de Thônex' },
  { slug: 'carouge', name: 'La Poste de Carouge' },
  { slug: 'king-jouet-carouge', name: 'King Jouet Carouge' },
  { slug: 'king-jouet-ecublens', name: 'King Jouet Ecublens' }
];
MACHINES.forEach((m, i) => m.color = `var(--s${i + 1})`);
const FLOORS = [[10,19,'Étage 1 (haut)'],[20,29,'Étage 2'],[30,39,'Étage 3'],[40,49,'Étage 4'],[50,59,'Étage 5'],[60,69,'Étage 6 (bas)']];
const TZ = 'Europe/Zurich';
const fmtDT = new Intl.DateTimeFormat('fr-CH', { timeZone: TZ, weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtShort = new Intl.DateTimeFormat('fr-CH', { timeZone: TZ, day: '2-digit', month: '2-digit' });
const chf = n => 'CHF ' + n.toLocaleString('fr-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let catalog = {}, state = {}, timelines = {}, config = { displays: {} };   // slug -> [{t: Date, slots: Map(slot -> {gid, stock, vol, price})}]
let view = { machine: null, a: null, b: null }; // index des points dans timelines[machine]

async function getJSON(url, fallback) {
  try { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw 0; return await r.json(); } catch (e) { return fallback; }
}
async function load() {
  state = await getJSON('data/state.json', { months: [] });
  catalog = await getJSON('data/catalog.json', {});
  config = await getJSON('config.json', { displays: {} });
  const lines = [];
  for (const month of state.months || []) {
    try {
      const r = await fetch('data/snapshots/' + month + '.jsonl', { cache: 'no-store' });
      if (r.ok) (await r.text()).split('\n').forEach(l => { if (l.trim()) lines.push(JSON.parse(l)); });
    } catch (e) {}
  }
  lines.sort((x, y) => x.t.localeCompare(y.t));
  // Chaque ligne contient soit l'état complet (k:1, début de mois), soit seulement les rails modifiés ([n] seul = rail retiré).
  const cur = {};
  MACHINES.forEach(m => { timelines[m.slug] = []; cur[m.slug] = new Map(); });
  const key = map => JSON.stringify([...map.entries()].sort((x, y) => x[0] - y[0]));
  for (const line of lines) {
    for (const [slug, slots] of Object.entries(line.m)) {
      if (!timelines[slug]) continue;
      const before = key(cur[slug]);
      const map = line.k ? new Map() : new Map(cur[slug]);
      slots.forEach(s => s.length === 1 ? map.delete(s[0]) : map.set(s[0], { gid: s[1], stock: s[2], vol: s[3], price: s[4] }));
      cur[slug] = map;
      if (key(map) !== before) timelines[slug].push({ t: new Date(line.t), slots: map });
    }
  }
  buildBoxes();
  const lc = state.last_check ? fmtDT.format(new Date(state.last_check)) : '—';
  document.getElementById('status').textContent = 'Dernière vérification : ' + lc + ' · ' + lines.length + ' instantanés' + (state.errors && state.errors.length ? ' · ⚠ non lues : ' + state.errors.join(', ') : '');
  const fromUrl = new URLSearchParams(location.search).get('m');
  selectMachine(MACHINES.some(m => m.slug === fromUrl) ? fromUrl : null);
}

/* ---------- calculs ---------- */
function totals(point) {
  let units = 0, cap = 0, empty = 0, value = 0;
  if (point) point.slots.forEach(s => { units += s.stock; cap += s.vol; value += s.stock * s.price; if (s.stock === 0) empty++; });
  return { units, cap, empty, value, slots: point ? point.slots.size : 0 };
}
// Mouvements entre deux points consécutifs : ventes = baisses, réassort = hausses ; un changement de produit sur un rail compte comme retrait + chargement.
// Pendant un reload, un display qui baisse alors que son booster est rechargé dans le même intervalle est compté comme « ouvert », pas comme vendu.
function step(prev, cur) {
  const out = new Map(); let sold = 0, revenue = 0, loaded = 0, swaps = 0, opened = 0;
  const keys = new Set([...prev.slots.keys(), ...cur.slots.keys()]);
  keys.forEach(k => {
    const p = prev.slots.get(k), c = cur.slots.get(k);
    const r = { sold: 0, revenue: 0, loaded: 0, removed: 0, opened: 0, swap: false, pg: p ? p.gid : null, cg: c ? c.gid : null, price: p ? p.price : 0 };
    if (p && c && p.gid === c.gid) {
      if (c.stock < p.stock) { r.sold = p.stock - c.stock; r.revenue = r.sold * p.price; }
      if (c.stock > p.stock) r.loaded = c.stock - p.stock;
    } else {
      r.swap = !!(p && c); if (p) r.removed = p.stock; if (c) r.loaded = c.stock;
    }
    if (r.sold || r.loaded || r.removed || r.swap) out.set(k, r);
    sold += r.sold; revenue += r.revenue; loaded += r.loaded; if (r.swap) swaps++;
  });
  if (loaded > 0 && settings.openMode) {
    const up = new Set(); out.forEach(r => { if (r.loaded && r.cg != null) up.add(r.cg); });
    out.forEach(r => {
      const b = boxOf(r.pg);
      if (r.sold && b && b.booster != null && up.has(b.booster)) {
        r.opened = r.sold; opened += r.sold; sold -= r.sold; revenue -= r.revenue; r.sold = 0; r.revenue = 0;
      }
    });
  }
  return { slots: out, sold, revenue, loaded, swaps, opened };
}
function range(tl, a, b) {
  const per = new Map(), prod = new Map(); let sold = 0, revenue = 0, loaded = 0, swaps = 0, opened = 0, reloads = 0;
  const P = g => { if (!prod.has(g)) prod.set(g, { sold: 0, revenue: 0, loaded: 0, removed: 0, opened: 0 }); return prod.get(g); };
  for (let i = a + 1; i <= b; i++) {
    const s = step(tl[i - 1], tl[i]);
    sold += s.sold; revenue += s.revenue; loaded += s.loaded; swaps += s.swaps; opened += s.opened; if (s.loaded > 0) reloads++;
    s.slots.forEach((r, k) => {
      const acc = per.get(k) || { sold: 0, revenue: 0, loaded: 0, removed: 0, opened: 0, swap: false };
      acc.sold += r.sold; acc.revenue += r.revenue; acc.loaded += r.loaded; acc.removed += r.removed; acc.opened += r.opened; acc.swap = acc.swap || r.swap;
      per.set(k, acc);
      if (r.pg != null) { const q = P(r.pg); q.sold += r.sold; q.revenue += r.revenue; q.removed += r.removed; q.opened += r.opened; }
      if (r.cg != null && r.loaded) P(r.cg).loaded += r.loaded;
    });
  }
  return { per, prod, sold, revenue, loaded, swaps, opened, reloads };
}
// Un reload peut s'étaler sur plusieurs instantanés : les intervalles avec rechargement espacés de moins de RELOAD_GAP sont regroupés.
const RELOAD_GAP = 60 * 6e4;
function reloadEvents(tl) {
  const ev = [];
  for (let i = 1; i < tl.length; i++) {
    const s = step(tl[i - 1], tl[i]);
    if (s.loaded <= 0) continue;
    const last = ev[ev.length - 1];
    if (last && tl[i].t - tl[last.b].t <= RELOAD_GAP) { last.b = i; last.loaded += s.loaded; last.opened += s.opened; last.swaps += s.swaps; }
    else ev.push({ a: i - 1, b: i, loaded: s.loaded, opened: s.opened, swaps: s.swaps });
  }
  return ev;
}
function salesSince(tl, ms) {
  const from = Date.now() - ms; let sold = 0, revenue = 0;
  for (let i = 1; i < tl.length; i++) if (tl[i].t >= from) { const s = step(tl[i - 1], tl[i]); sold += s.sold; revenue += s.revenue; }
  return { sold, revenue };
}
const name = gid => (catalog[gid] && catalog[gid].name) || ('Produit ' + gid);
const img = gid => (catalog[gid] && catalog[gid].image) || '';
/* ---------- displays ---------- */
const FLAG_RE = /\p{Regional_Indicator}{2}/u;
const STOP = new Set(['display', 'booster', 'boosters', 'pokemon', 'box', 'boite', 'de', 'des', 'du', 'la', 'le', 'the', 'of', 'set', 'tcg', 'pack']);
let BOX = {}, AUTO = {}, settings = { openMode: true, boxes: {} };
try { settings = Object.assign(settings, JSON.parse(localStorage.getItem('bs-settings') || '{}')); } catch (e) {}
const saveSettings = () => { try { localStorage.setItem('bs-settings', JSON.stringify(settings)); } catch (e) {} };
function parseName(gid) {
  const n = name(gid), flag = (n.match(FLAG_RE) || [''])[0];
  const toks = n.replace(/\p{Regional_Indicator}/gu, ' ').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .split(/[^a-z0-9]+/).filter(t => t.length > 1 && !STOP.has(t));
  return { n, flag, toks };
}
function lastPrices() { const m = {}; Object.values(timelines).forEach(tl => tl.forEach(p => p.slots.forEach(s => m[s.gid] = s.price))); return m; }
function defaultPer(gid) {
  const { n, flag } = parseName(gid), l = n.toLowerCase();
  if (/etb|elite trainer/.test(l)) return 9;
  if (/one piece|\bop\d/.test(l) || /dragon ball|lorcana|yu-gi-oh/.test(l)) return 24;
  if (/magic/.test(l)) return 36;
  if (flag === '🇯🇵' || flag === '🇨🇳') return 30;
  return 36;
}
function buildBoxes() {
  const price = lastPrices(), gids = Object.keys(catalog).map(Number);
  const isBox = g => /display|\betb\b|elite trainer|coffret|\bbox\b/i.test(name(g)) || (price[g] || 0) >= 60;
  const boxes = gids.filter(isBox), others = gids.filter(g => !isBox(g) && !/mystery|graded|pochette|portfolio/i.test(name(g)));
  AUTO = {};
  boxes.forEach(g => {
    const a = parseName(g); let best = null, score = 0;
    others.forEach(o => {
      const b = parseName(o); if (b.flag !== a.flag) return;
      const inter = a.toks.filter(t => b.toks.includes(t)).length, uni = new Set([...a.toks, ...b.toks]).size;
      const j = uni ? inter / uni : 0; if (j > score) { score = j; best = o; }
    });
    AUTO[g] = { booster: score >= 0.6 ? best : null, per: defaultPer(g) };
  });
  BOX = {};
  boxes.forEach(g => {
    const c = (config.displays || {})[g] || {}, s = settings.boxes[g] || {};
    BOX[g] = {
      booster: 'booster' in s ? s.booster : 'booster' in c ? c.booster : AUTO[g].booster,
      per: s.per || c.per || AUTO[g].per,
      checked: !!(s.per || c.per)
    };
  });
}
const boxOf = gid => gid == null ? null : BOX[gid] || null;

const stClass = (stock, vol) => stock === 0 ? 'st-empty' : stock <= 2 ? 'st-low' : 'st-ok';

/* ---------- navigation ---------- */
function renderTabs() {
  const t = document.getElementById('tabs');
  t.innerHTML = [{ slug: null, name: 'Vue d’ensemble' }, ...MACHINES].map(m =>
    `<button class="tab ${view.machine === m.slug ? 'active' : ''}" data-m="${m.slug || ''}">${esc(m.name)}</button>`).join('');
  t.querySelectorAll('.tab').forEach(b => b.onclick = () => selectMachine(b.dataset.m || null));
}
function selectMachine(slug) {
  view.machine = slug;
  try { history.replaceState(null, '', slug ? '?m=' + slug : location.pathname); } catch (e) {}
  if (slug) {
    const tl = timelines[slug], ev = reloadEvents(tl);
    if (ev.length) { view.a = ev[ev.length - 1].a; view.b = ev[ev.length - 1].b; }
    else { view.a = 0; view.b = Math.max(0, tl.length - 1); }
  }
  renderTabs(); render();
}
function render() { view.machine ? renderMachine() : renderOverview(); }

/* ---------- vue d'ensemble ---------- */
function renderOverview() {
  const rows = MACHINES.map(m => {
    const tl = timelines[m.slug], last = tl[tl.length - 1], t = totals(last), ev = reloadEvents(tl);
    const d1 = salesSince(tl, 864e5), d7 = salesSince(tl, 7 * 864e5);
    return { m, t, last, ev, d1, d7 };
  });
  const sum = rows.reduce((a, r) => ({ units: a.units + r.t.units, cap: a.cap + r.t.cap, empty: a.empty + r.t.empty, s1: a.s1 + r.d1.sold, r1: a.r1 + r.d1.revenue, s7: a.s7 + r.d7.sold, r7: a.r7 + r.d7.revenue }), { units: 0, cap: 0, empty: 0, s1: 0, r1: 0, s7: 0, r7: 0 });
  document.getElementById('app').innerHTML = `
  <section class="panel">
    <div class="kpis">
      <div class="kpi"><b>${sum.units}</b><span>unités en stock (${sum.cap ? Math.round(100 * sum.units / sum.cap) : 0} % de la capacité)</span></div>
      <div class="kpi"><b>${sum.empty}</b><span>emplacements vides</span></div>
      <div class="kpi"><b>${sum.s1}</b><span>ventes sur 24 h · ${chf(sum.r1)}</span></div>
      <div class="kpi"><b>${sum.s7}</b><span>ventes sur 7 jours · ${chf(sum.r7)}</span></div>
    </div>
  </section>
  <section class="panel">
    <div class="chart-head"><h2 style="margin:0">Chiffre d’affaires estimé par jour et par machine</h2>${periodHTML('perO')}</div>
    <div class="legend" style="margin-bottom:8px">${MACHINES.map(m => `<span><i style="background:${m.color}"></i>${esc(m.name)}</span>`).join('')}</div>
    <div class="viz" id="caO"><svg role="img" aria-label="Chiffre d’affaires par jour, empilé par machine"></svg><div class="tip"></div></div>
    <h2 style="margin-top:16px">CA sur ${PERIOD} jours, par machine</h2>
    <div id="rankO"></div>
    <p class="hint">Ventes (baisses de stock) × prix affiché, par jour (heure de Genève). Les displays ouverts pendant un reload ne comptent pas. Chaque machine garde sa couleur partout.</p>
  </section>
  <section class="panel scroll">
    <h2>Par machine</h2>
    <table>
      <thead><tr><th>Machine</th><th class="n">Stock</th><th class="n">Remplissage</th><th class="n">Vides</th><th class="n">Ventes 24 h</th><th class="n">Ventes 7 j</th><th>Dernier reload</th><th>Dernier changement</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td><i class="sw" style="background:${r.m.color}"></i><a href="?m=${r.m.slug}" data-m="${r.m.slug}">${esc(r.m.name)}</a></td>
        <td class="n">${r.last ? r.t.units : '—'}</td>

}

/* ---------- vue machine ---------- */
function pointLabel(tl, i) {
  const s = i > 0 ? step(tl[i - 1], tl[i]) : null;
  let tag = '';
  if (s && s.loaded) tag = ' ⟳ reload +' + s.loaded;
  else if (s && s.sold) tag = ' −' + s.sold;
  return fmtDT.format(tl[i].t) + tag;
}

function floorsHTML(A, B, per) {

  const groups = FLOORS.map(([lo, hi, label]) => ({ label, nums: nums.filter(n => n >= lo && n <= hi) }));
  const other = nums.filter(n => !FLOORS.some(([lo, hi]) => n >= lo && n <= hi));
  if (other.length) groups.push({ label: 'Autres rails', nums: other });
  return groups.filter(g => g.nums.length).map(g => `<div class="floor"><div class="floor-label">${g.label}</div><div class="slots">
    ${g.nums.map(n => {

          <span>${mv && mv.sold ? `<span class="d-sold">−${mv.sold}</span> ` : ''}${mv && mv.opened ? `<span class="tag" title="displays ouverts pour le réassort">${mv.opened} ouvert${mv.opened > 1 ? 's' : ''}</span> ` : ''}${mv && mv.loaded ? `<span class="d-load">+${mv.loaded}</span>` : ''}</span></div>

}

function movesTable(A, B, per) {

  if (!rows.length) return '<p class="muted">Aucun mouvement entre ces deux points.</p>';
  return `<table><thead><tr><th>Rail</th><th>Produit</th><th class="n">Stock A</th><th class="n">Stock B</th><th class="n">Vendus</th><th class="n">CA estimé</th><th class="n">Displays ouverts</th><th class="n">Rechargés</th></tr></thead><tbody>
    ${rows.map(([n, mv]) => { const a = A.slots.get(n), b = B.slots.get(n); return `<tr>
      <td>${n}</td><td>${esc(b ? name(b.gid) : name(a.gid))}${mv.swap ? `<div class="swap">↺ remplace ${esc(a ? name(a.gid) : '—')}${mv.removed ? ` (${mv.removed} retiré${mv.removed > 1 ? 's' : ''})` : ''}</div>` : ''}</td>
      <td class="n">${a ? a.stock : '—'}</td><td class="n">${b ? b.stock : '—'}</td>
      <td class="n d-sold">${mv.sold || ''}</td><td class="n">${mv.revenue ? chf(mv.revenue) : ''}</td><td class="n">${mv.opened || ''}</td><td class="n d-load">${mv.loaded ? '+' + mv.loaded : ''}</td></tr>`; }).join('')}
  </tbody></table>`;
}

function boostersFromBoxes(prod) {
  const by = {}; let total = 0;
  prod.forEach((q, g) => { const b = boxOf(g); if (b && b.booster != null && q.opened) { by[b.booster] = (by[b.booster] || 0) + q.opened * b.per; total += q.opened * b.per; } });
  return { by, total };
}
function productTable(A, B, r) {
  const sum = (pt, g) => { let s = 0; pt.slots.forEach(x => { if (x.gid === g) s += x.stock; }); return s; };
  const fb = boostersFromBoxes(r.prod).by;
  const rows = [...r.prod.entries()].filter(([g, q]) => q.sold || q.loaded || q.removed || q.opened)
    .sort((x, y) => name(x[0]).localeCompare(name(y[0]), 'fr'));
  if (!rows.length) return '<p class="muted">Aucun mouvement entre ces deux points.</p>';
  return `<table><thead><tr><th>Produit</th><th class="n">Stock A</th><th class="n">Stock B</th><th class="n">Vendus</th><th class="n">CA estimé</th><th class="n">Rechargés</th>
    <th class="n">Displays ouverts</th><th class="n">Boosters issus des displays (est.)</th><th class="n">Écart : rechargés − issus des displays</th></tr></thead><tbody>
    ${rows.map(([g, q]) => {
      const box = boxOf(g), from = fb[g] || 0, ext = q.loaded - from;
      return `<tr><td>${esc(name(g))}${box ? ` <span class="tag">display${box.booster != null ? ' → ' + box.per + ' boosters' : ''}</span>` : ''}</td>
        <td class="n">${sum(A, g)}</td><td class="n">${sum(B, g)}</td>

        <td class="n">${q.opened ? q.opened + (box && box.booster != null ? ` <span class="muted small">≈ ${q.opened * box.per} boosters</span>` : '') : ''}</td>
        <td class="n">${from ? '≈ ' + from : ''}</td>
        <td class="n">${from ? (ext > 0 ? `<span title="Plus de boosters rechargés que ce que les displays ouverts peuvent fournir : apport extérieur">+${ext} <span class="muted small">apport extérieur</span></span>` : ext < 0 ? `<span title="Les displays ouverts contenaient plus de boosters que ceux rechargés">${ext} <span class="muted small">pas en machine</span></span>` : '0') : ''}</td></tr>`;
    }).join('')}
  </tbody></table>
  <p class="hint">« Boosters issus des displays » = displays de ce booster ouverts entre A et B × boosters par display. Écart positif : boosters venus d’ailleurs (stock extérieur). Écart négatif : boosters sortis des displays mais pas mis dans cette machine (gardés en réserve ou mis dans une autre machine). Estimations : un display acheté par un client pendant un reload est compté comme ouvert.</p>`;
}
function boxSettingsHTML() {

function bindBoxSettings(rerender) {
  const keepOpen = () => { const d = document.querySelector('details.cfg'); return d && d.open; };
  const apply = () => { const open = keepOpen(); saveSettings(); buildBoxes(); rerender(); if (open) { const d = document.querySelector('details.cfg'); if (d) d.open = true; } };
  const om = document.getElementById('openMode'); if (!om) return;
  om.onchange = e => { settings.openMode = e.target.checked; apply(); };
  document.querySelectorAll('[data-box]').forEach(s => s.onchange = e => { const g = s.dataset.box; settings.boxes[g] = Object.assign({}, settings.boxes[g], { booster: e.target.value === '' ? null : +e.target.value }); apply(); });
  document.querySelectorAll('[data-per]').forEach(s => s.onchange = e => { const g = s.dataset.per, v = Math.max(1, Math.min(60, +e.target.value || 0)); settings.boxes[g] = Object.assign({}, settings.boxes[g], { per: v }); apply(); });
  document.getElementById('cfgReset').onclick = () => { settings.boxes = {}; apply(); };
  document.getElementById('cfgCopy').onclick = async () => {
    const out = { displays: {} }; Object.entries(BOX).forEach(([g, b]) => out.displays[g] = { name: name(+g), booster: b.booster, per: b.per });
    const txt = JSON.stringify(out, null, 1);
    try { await navigator.clipboard.writeText(txt); document.getElementById('cfgMsg').textContent = 'Copié.'; }
    catch (e) { document.getElementById('cfgMsg').textContent = 'Copie impossible ici.'; }
  };

/* ---------- chiffre d'affaires par jour ---------- */
const dayFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const dayKey = d => dayFmt.format(d);
const dayLabel = k => k.slice(8, 10) + '.' + k.slice(5, 7);
const dayLong = k => new Intl.DateTimeFormat('fr-CH', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }).format(new Date(k + 'T12:00:00Z'));
let PERIOD = 30;
try { PERIOD = +localStorage.getItem('bs-period') || 30; } catch (e) {}
function dailyRevenue(tl) {
  const m = {};
  for (let i = 1; i < tl.length; i++) { const s = step(tl[i - 1], tl[i]); if (s.revenue || s.sold) { const k = dayKey(tl[i].t); m[k] = m[k] || { ca: 0, n: 0 }; m[k].ca += s.revenue; m[k].n += s.sold; } }
  return m;
}
function lastDays(n) { const out = [], now = Date.now(); for (let k = n - 1; k >= 0; k--) out.push(dayKey(new Date(now - k * 864e5))); return [...new Set(out)]; }
const chf0 = n => 'CHF ' + Math.round(n).toLocaleString('fr-CH');
function niceMax(v) { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function periodHTML(id) {
  return `<div class="seg" role="group" aria-label="Période" id="${id}">${[7, 30, 90].map(n => `<button data-p="${n}" class="${PERIOD === n ? 'on' : ''}">${n} j</button>`).join('')}</div>`;
}
function bindPeriod(id, rerender) {
  document.querySelectorAll('#' + id + ' button').forEach(b => b.onclick = () => { PERIOD = +b.dataset.p; try { localStorage.setItem('bs-period', PERIOD); } catch (e) {} rerender(); });
}
const roundTop = (x, y, w, h, r) => { r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
// Barres par jour, empilées par série (une couleur par machine). series: [{name, color, data: {jour: {ca, n}}}]
function drawDailyBars(el, days, series, opts = {}) {
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  const W = svg.clientWidth || 800, H = 220, pl = 80, pr = 8, pt = 10, pb = 24;
  const tot = days.map(d => series.reduce((s, x) => s + ((x.data[d] || {}).ca || 0), 0));
  const max = niceMax(Math.max(...tot, 0)), slot = (W - pl - pr) / days.length, bw = Math.max(2, Math.min(28, slot * 0.72));
  const y = v => pt + (H - pt - pb) * (1 - v / max), x = i => pl + slot * i + (slot - bw) / 2;
  const every = Math.ceil(days.length / Math.max(2, Math.floor((W - pl) / 52)));
  let g = [0, 0.5, 1].map(f => `<line x1="${pl}" x2="${W - pr}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(max * f) + 4}" text-anchor="end">${chf0(max * f)}</text>`).join('');
  if (opts.band) { const i0 = days.indexOf(opts.band[0]), i1 = days.indexOf(opts.band[1]); if (i0 >= 0 || i1 >= 0) { const a = Math.max(0, i0 < 0 ? 0 : i0), b = i1 < 0 ? days.length - 1 : i1; g += `<rect x="${pl + slot * a}" y="${pt}" width="${slot * (b - a + 1)}" height="${H - pt - pb}" fill="var(--accent)" opacity=".08"/>`; } }
  days.forEach((d, i) => {
    let base = 0; const segs = series.map(s => ({ s, v: (s.data[d] || {}).ca || 0 })).filter(z => z.v > 0);
    segs.forEach((z, k) => {
      const y0 = y(base), y1 = y(base + z.v), top = k === segs.length - 1, gap = k > 0 ? 2 : 0;
      const hgt = Math.max(0, y0 - y1 - gap);
      if (hgt > 0) g += top ? `<path d="${roundTop(x(i), y1, bw, hgt, 4)}" fill="${z.s.color}" data-d="${i}"/>` : `<rect x="${x(i)}" y="${y1}" width="${bw}" height="${hgt}" fill="${z.s.color}" data-d="${i}"/>`;
      base += z.v;
    });
    if (i % every === 0 || i === days.length - 1) g += `<text x="${pl + slot * i + slot / 2}" y="${H - 6}" text-anchor="middle">${dayLabel(d)}</text>`;
    g += `<rect class="hit" x="${pl + slot * i}" y="${pt}" width="${slot}" height="${H - pt - pb}" data-i="${i}"/>`;
  });
  g += `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" opacity=".5"/>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H); svg.innerHTML = g;
  svg.querySelectorAll('.hit').forEach(r => {
    r.onmousemove = e => {
      const i = +r.dataset.i, d = days[i];
      const rows = series.map(s => ({ s, v: s.data[d] || { ca: 0, n: 0 } })).filter(z => z.v.ca > 0).sort((p, q) => q.v.ca - p.v.ca);
      tip.innerHTML = `<div style="margin-bottom:4px"><b>${dayLong(d)}</b></div>` + (rows.length
        ? (series.length > 1 ? rows.map(z => `<div class="r"><span><i class="sw" style="background:${z.s.color}"></i>${esc(z.s.name)}</span><b>${chf(z.v.ca)}</b></div>`).join('') + `<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>Total</span><b>${chf(tot[i])}</b></div>`
          : `<div class="r"><span>CA estimé</span><b>${chf(tot[i])}</b></div><div class="r"><span>Unités vendues</span><b>${rows[0].v.n}</b></div>`)
        : '<span class="muted">Aucune vente</span>');
      tip.style.display = 'block';
      const bx = el.getBoundingClientRect(), tx = e.clientX - bx.left + 14, tw = tip.offsetWidth;
      tip.style.left = Math.min(tx, bx.width - tw - 4) + 'px'; tip.style.top = Math.max(0, e.clientY - bx.top - 20) + 'px';
      svg.querySelectorAll('[data-d]').forEach(m => m.style.opacity = +m.dataset.d === i ? 1 : 0.35);
    };
    r.onmouseleave = () => { tip.style.display = 'none'; svg.querySelectorAll('[data-d]').forEach(m => m.style.opacity = 1); };
  });
}
// Classement horizontal : CA total de la période par machine, trié, chaque barre à la couleur de sa machine.
function rankingHTML(rows) {
  const max = Math.max(...rows.map(r => r.ca), 1);
  return `<div style="display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 10px;align-items:center">${rows.map(r => `
    <div class="small"><i class="sw" style="background:${r.m.color}"></i>${esc(r.m.name)}</div>
    <div style="display:flex;align-items:center;gap:8px;min-width:0"><div style="height:14px;width:${(100 * r.ca / max).toFixed(1)}%;min-width:${r.ca > 0 ? 3 : 0}px;background:${r.m.color};border-radius:0 4px 4px 0"></div><span class="small" style="white-space:nowrap;font-variant-numeric:tabular-nums">${chf(r.ca)}</span></div>`).join('')}</div>`;
}

function drawChart(tl, a, b, evIdx, set) {
  const svg = document.getElementById('chart');
  const W = svg.clientWidth || 800, H = 190, pl = 36, pr = 10, pt = 12, pb = 22;
  const vals = tl.map(p => totals(p).units), t0 = tl[0].t.getTime(), t1 = Math.max(tl[tl.length - 1].t.getTime(), Date.parse(state.last_check || 0) || 0, t0 + 1);
  const max = Math.max(1, ...vals), x = t => pl + (W - pl - pr) * (t - t0) / (t1 - t0), y = v => pt + (H - pt - pb) * (1 - v / max);
  let d = '';
  tl.forEach((p, i) => { const X = x(p.t.getTime()), Y = y(vals[i]); d += i ? `H${X.toFixed(1)}V${Y.toFixed(1)}` : `M${X.toFixed(1)},${Y.toFixed(1)}`; });
  d += `H${x(t1).toFixed(1)}`;
  const ticks = [0, .5, 1].map(f => Math.round(max * f));
  const nDays = Math.max(1, Math.round((t1 - t0) / 864e5)), dayStep = Math.ceil(nDays / 6);
  let xt = '';
  const startDay = new Date(t0); startDay.setHours(0, 0, 0, 0);
  for (let t = startDay.getTime() + 864e5, k = 0; t < t1; t += 864e5, k++) if (k % dayStep === 0) xt += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${fmtShort.format(new Date(t))}</text><line x1="${x(t)}" x2="${x(t)}" y1="${pt}" y2="${H - pb}" stroke="var(--line)"/>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `
    ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
    ${xt}
    <rect x="${x(tl[a].t.getTime())}" y="${pt}" width="${Math.max(2, x(tl[b].t.getTime()) - x(tl[a].t.getTime()))}" height="${H - pt - pb}" fill="var(--accent)" opacity=".10"/>
    ${evIdx.map(i => `<line x1="${x(tl[i].t.getTime())}" x2="${x(tl[i].t.getTime())}" y1="${pt}" y2="${H - pb}" stroke="var(--load)" stroke-dasharray="3 3"/>`).join('')}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${[['A', a], ['B', b]].map(([l, i]) => `<circle cx="${x(tl[i].t.getTime())}" cy="${y(vals[i])}" r="4" fill="var(--accent)"/><text x="${x(tl[i].t.getTime()) + 6}" y="${y(vals[i]) - 6}" style="fill:var(--ink);font-weight:600">${l}</text>`).join('')}`;
  svg.onclick = e => {
    const rect = svg.getBoundingClientRect(), t = t0 + (t1 - t0) * ((e.clientX - rect.left) * W / rect.width - pl) / (W - pl - pr);
    let idx = 0; tl.forEach((p, i) => { if (p.t.getTime() <= t) idx = i; });
    e.shiftKey ? set(idx, view.b) : set(view.a, idx);
  };
}
window.addEventListener('resize', () => { if (!timelines.rive) return; view.machine ? renderMachine() : renderOverview(); });
load();
</script>
