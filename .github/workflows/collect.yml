name: Instantané du stock

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour un instantané immédiat

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les 8 machines
        run: python collect.py
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name  "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -q -m "Instantané $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase
            git push -q
          fi
